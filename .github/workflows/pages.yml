name: Deploy GeoCare to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview:
        description: Publish the signed-in synthetic directory demo
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: geocare-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Select the Pages deployment target
        id: target
        env:
          CONFIGURED_API: ${{ vars.GEOCARE_API_URL }}
          FORCE_PREVIEW: ${{ inputs.preview }}
        run: |
          api="$CONFIGURED_API"
          if [ -z "$api" ] && [ -f deploy/pages-api-url.txt ]; then
            api="$(tr -d '\r\n' < deploy/pages-api-url.txt)"
          fi
          if [ "$FORCE_PREVIEW" = "true" ] || { [ -z "$api" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; }; then
            echo 'preview=1' >> "$GITHUB_OUTPUT"
          elif [ -z "$api" ]; then
            echo 'Set GEOCARE_API_URL or deploy/pages-api-url.txt before publishing the connected application.' >&2
            exit 1
          else
            echo 'preview=0' >> "$GITHUB_OUTPUT"
            echo "api=$api" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Verify the hosted sandbox API and Pages origin
        if: steps.target.outputs.preview == '0'
        run: node scripts/verify-pages-api.mjs
        env:
          GEOCARE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_API_URL: ${{ steps.target.outputs.api }}
      - run: npm run build
        working-directory: frontend
        env:
          GEOCARE_PAGES: '1'
          NEXT_PUBLIC_GEOCARE_PREVIEW: ${{ steps.target.outputs.preview }}
          GEOCARE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_API_URL: ${{ steps.target.outputs.api }}
          NEXT_PUBLIC_TILE_URL: ${{ vars.GEOCARE_TILE_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_EMBED_KEY: ${{ vars.GEOCARE_GOOGLE_MAPS_EMBED_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out
      - uses: actions/deploy-pages@v4
        id: deploy
