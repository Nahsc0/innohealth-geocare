name: GeoCare checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        storage: [sqlite, postgis]
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: geocare
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: geocare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geocare -d geocare_test"
          --health-interval 4s --health-timeout 4s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - if: matrix.storage == 'sqlite'
        run: python -m pytest backend/tests -q
      - if: matrix.storage == 'postgis'
        run: python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://geocare:ci-only@127.0.0.1/geocare_test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          python -m uvicorn backend.main:app --port 8000 --no-access-log &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then cd frontend && npm run e2e; exit $?; fi
            sleep 1
          done
          exit 1
        env:
          GEOCARE_BUILD_TEST: "1"
          GEOCARE_DEV_MAILBOX: ${{ runner.temp }}/geocare-test-mail.jsonl
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: frontend/test-results
